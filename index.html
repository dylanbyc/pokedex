<!doctype html>
<html lang="zh">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#c8102e" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Pokédex" />
    <link rel="manifest" href="manifest.webmanifest" />
    <link rel="icon" href="icon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="icon-180.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@500;700;800&family=Nunito:wght@600;800;900&display=swap"
      rel="stylesheet"
    />
    <title>Pokédex Scanner</title>
  </head>
  <body>
    <div class="device" id="device">
      <!-- LEFT HALF: lens, camera screen, controls -->
      <section class="half left" id="leftHalf">
        <header class="top">
          <div class="lens" id="lens"><span></span></div>
          <div class="leds"><i class="led red"></i><i class="led yellow"></i><i class="led green"></i></div>
          <h1 data-t="title">宝可梦图鉴</h1>
        </header>

        <div class="bezel cam-bezel">
          <div class="bezel-dots"><i></i><i></i></div>
          <div class="screen-stack" id="screenStack">
          <div class="screen cam-screen" id="camScreen">
            <video id="video" playsinline muted autoplay></video>
            <div class="guide" id="guide">
              <span class="c tl"></span><span class="c tr"></span><span class="c bl"></span><span class="c br"></span>
              <div class="name-band"></div>
              <div class="scanline"></div>
            </div>
            <canvas class="quad-canvas" id="quadCanvas"></canvas>
            <div class="flash" id="flash"></div>
            <div class="cam-overlay" id="startOverlay">
              <button class="start-btn" id="startBtn">
                <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 3 7.2 5H4a2 2 0 0 0-2 2v11a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2V7a2 2 0 0 0-2-2h-3.2L15 3H9Zm3 5a5 5 0 1 1 0 10 5 5 0 0 1 0-10Zm0 2a3 3 0 1 0 0 6 3 3 0 0 0 0-6Z" fill="currentColor"/></svg>
                <span data-t="start">开始扫描</span>
              </button>
              <p class="start-hint" data-t="startHint">点一下，打开相机</p>
              <p class="cam-error" id="camError" hidden></p>
            </div>
            <button class="again-btn" id="againBtn" hidden data-t="scanAgain">再扫一张</button>
          </div>
          </div>
          <div class="bezel-foot">
            <i class="mini-red"></i>
            <div class="grill"><i></i><i></i><i></i><i></i></div>
          </div>
        </div>

        <div class="controls">
          <button class="big-btn" id="scanBtn" aria-label="Scan"><span class="ai-tag" id="aiTag" hidden>AI</span></button>
          <div class="mid">
            <div class="pills"><i class="pill red"></i><i class="pill blue"></i></div>
            <div class="lcd" id="status"><span data-t="startHint">点一下，打开相机</span></div>
          </div>
          <div class="dpad" aria-label="Previous / next">
            <button class="up" id="dUp" aria-label="Previous"></button>
            <button class="left" id="dLeft" aria-label="Previous"></button>
            <span class="center"></span>
            <button class="right" id="dRight" aria-label="Next"></button>
            <button class="down" id="dDown" aria-label="Next"></button>
          </div>
        </div>
      </section>

      <div class="hinge" aria-hidden="true"><i></i><i></i><i></i></div>

      <!-- RIGHT HALF: entry screen and blue keys -->
      <section class="half right" id="rightHalf">
        <div class="right-top" aria-hidden="true"></div>
        <div class="screen info-screen" id="info">
          <div class="idle" id="idle">
            <div class="radar"><i></i><i></i><i></i></div>
            <p data-t="waiting">等待扫描…</p>
            <p class="seen-count"><span data-t="seen">已发现</span> <b id="seenCount">0</b> / 1025</p>
          </div>
          <div class="special" id="special" hidden></div>
          <article class="entry" id="entry" hidden></article>
          <button class="back-cam" id="backCam">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 3 7.2 5H4a2 2 0 0 0-2 2v11a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2V7a2 2 0 0 0-2-2h-3.2L15 3H9Zm3 5a5 5 0 1 1 0 10 5 5 0 0 1 0-10Zm0 2a3 3 0 1 0 0 6 3 3 0 0 0 0-6Z" fill="currentColor"/></svg>
            <span data-t="backToCam">返回相机</span>
          </button>
        </div>

        <div class="keys">
          <button class="key lang-key" data-lang="zh">中文</button>
          <button class="key lang-key" data-lang="en">EN</button>
          <button class="key lang-key" data-lang="ja">日本語</button>
          <button class="key icon-key" id="speakBtn" aria-label="Speak">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 9v6h4l5 5V4L7 9H3Zm13.5 3A4.5 4.5 0 0 0 14 8v8a4.5 4.5 0 0 0 2.5-4ZM14 3.2v2.1a7 7 0 0 1 0 13.4v2.1a9 9 0 0 0 0-17.6Z" fill="currentColor"/></svg>
            <span data-t="speak">朗读</span>
          </button>
          <button class="key icon-key" id="browseBtn">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 4h7a2 2 0 0 1 2 2v14a3 3 0 0 0-3-3H4V4Zm16 0h-5a2 2 0 0 0-2 2v14a3 3 0 0 1 3-3h4V4Z" fill="currentColor"/></svg>
            <span data-t="search">图鉴</span>
          </button>
          <button class="key icon-key" id="settingsBtn">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M19.4 13a7.5 7.5 0 0 0 0-2l2.1-1.6-2-3.4-2.5 1a7.4 7.4 0 0 0-1.7-1L15 3.3h-4l-.4 2.7a7.4 7.4 0 0 0-1.7 1l-2.5-1-2 3.4L6.6 11a7.5 7.5 0 0 0 0 2l-2.1 1.6 2 3.4 2.5-1c.5.4 1.1.8 1.7 1l.4 2.7h4l.4-2.7c.6-.2 1.2-.6 1.7-1l2.5 1 2-3.4-2.3-1.6ZM13 15.5a3.5 3.5 0 1 1 0-7 3.5 3.5 0 0 1 0 7Z" transform="translate(-1 0)" fill="currentColor"/></svg>
            <span data-t="settings">设置</span>
          </button>
        </div>
        <div class="right-foot" id="rightFoot" aria-hidden="true">
          <i class="bar"></i><i class="bar"></i><i class="yellow-dot"></i>
        </div>
      </section>
    </div>

    <!-- Browse dialog -->
    <dialog id="browse" class="sheet">
      <div class="sheet-head">
        <input id="searchInput" type="search" autocomplete="off" />
        <label class="chip-toggle"><input type="checkbox" id="onlySeen" /> <span>✓</span></label>
        <button class="close-btn" data-close data-t="close">关闭</button>
      </div>
      <div class="grid" id="grid"></div>
    </dialog>

    <!-- Settings dialog -->
    <dialog id="settings" class="sheet small">
      <div class="sheet-head">
        <h2 data-t="settings">设置</h2>
        <button class="close-btn" data-close data-t="close">关闭</button>
      </div>
      <div class="settings-body">
        <fieldset>
          <legend data-t="cardLang">卡片的语言</legend>
          <p class="hint" data-t="cardLangHint"></p>
          <div class="seg" id="cardLangSeg">
            <label><input type="radio" name="cardLang" value="en" /><span>English</span></label>
            <label><input type="radio" name="cardLang" value="ja" /><span>日本語</span></label>
            <label><input type="radio" name="cardLang" value="zhs" /><span>简体中文</span></label>
            <label><input type="radio" name="cardLang" value="zht" /><span>繁體中文</span></label>
          </div>
        </fieldset>
        <label class="switch-row"><span data-t="autoScan">自动扫描</span><input type="checkbox" id="autoScan" /></label>
        <label class="switch-row"><span data-t="voice">语音朗读</span><input type="checkbox" id="voiceOn" /></label>
        <fieldset id="voiceRow">
          <legend data-t="voicePick">朗读的声音</legend>
          <div class="voice-row">
            <select id="voiceSel"></select>
            <button class="try-btn" id="voiceTry" data-t="tryVoice">试听</button>
          </div>
          <p class="hint" data-t="voiceHint"></p>
        </fieldset>
        <fieldset>
          <legend data-t="aiMode">AI 识别</legend>
          <input id="aiKey" type="password" placeholder="sk-ant-…" autocomplete="off" spellcheck="false" />
          <p class="hint" data-t="aiKeyHint"></p>
        </fieldset>
        <button class="danger" id="resetSeen" data-t="resetSeen">清空已发现记录</button>
        <p class="disclaimer" data-t="disclaimer"></p>
      </div>
    </dialog>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
